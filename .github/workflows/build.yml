name: Build Artifacts

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 25
    - name: Set env
      run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
    - name: Set up keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" > keystore.txt
        base64 --decode keystore.txt > bekeystore.jks
    - name: Create artifacts
      env:
        keystore_password: ${{ secrets.KEYSTORE_PASSWORD_SECRET }}
        keystore_alias_password: ${{ secrets.KEYSTORE_PASSWORD_SECRET }}
        keystore_alias: frog
        JDK_DIR: /home/runner/jdks/
      run: |
        git clone --depth=1 --branch=v9 https://github.com/rally-4/Mindustryan
        cd Mindustryan
        echo "BODY=$(git rev-parse HEAD)" >> $GITHUB_ENV
        sed -i 's/applicationId "io.rally.mindustryan"/applicationId "io.rally.mindustryan.be"/g' android/build.gradle
        sed -i 's/"io.rally.mindustryan"/"io.rally.mindustryan.be"/g' android/AndroidManifest.xml
        sed -i 's/Mindustryan/Mindustryan BE/g' android/res/values/strings.xml
        ./gradlew pack
        ./gradlew desktop:dist server:dist core:depsJar core:assetsJar android:assembleRelease -Pbuildversion=${RELEASE_VERSION} -PversionType=bleeding-edge -PshowCommitHash --stacktrace
        mv desktop/build/libs/Mindustryan.jar desktop/build/libs/Mindustryan-BE-Desktop-${RELEASE_VERSION}.jar
        mv server/build/libs/server-release.jar server/build/libs/Mindustryan-BE-Server-${RELEASE_VERSION}.jar
        mv android/build/outputs/apk/release/android-release.apk android/build/outputs/apk/release/Mindustryan-BE-Android-${RELEASE_VERSION}.apk
        echo "JDK directory: $JDK_DIR"
        ./gradlew desktop:dist -Pbuildversion=${RELEASE_VERSION} -Prelease -PversionModifier=steam -PversionType=bleeding-edge -PshowCommitHash desktop:packrLinux64 desktop:packrWindows64 desktop:packrMacOS --stacktrace
        echo $PWD
        ls deploy/
    - name: Upload desktop artifacts
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: Mindustryan/desktop/build/libs/Mindustryan-BE-Desktop-${{ env.RELEASE_VERSION }}.jar
        tag: ${{ github.ref }}
        release_name: "Build ${{ env.RELEASE_VERSION }}"
        body: ${{ env.BODY }}
    - name: Upload server artifacts
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: Mindustryan/server/build/libs/Mindustryan-BE-Server-${{ env.RELEASE_VERSION }}.jar
        tag: ${{ github.ref }}
    - name: Upload Android artifacts
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: Mindustryan/android/build/outputs/apk/release/Mindustryan-BE-Android-${{ env.RELEASE_VERSION }}.apk
        tag: ${{ github.ref }}
    - name: Upload latest version dependencies
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: Mindustryan/core/build/libs/core-release-deps.jar
        tag: master
        asset_name: latest.jar
        overwrite: true
    - name: Upload latest version assets
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: Mindustryan/core/build/libs/core-release-assets.jar
        tag: master
        asset_name: assets.jar
        overwrite: true
